# Local development PostgreSQL only. No paid/cloud services.
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolioiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolioiq
      POSTGRES_USER: ${POSTGRES_USER:-portfolioiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolioiq}
    ports:
      - "5432:5432"
    volumes:
      - portfolioiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolioiq} -d portfolioiq"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  portfolioiq_pgdata:
